name: Test and deploy

# Every push to main runs the pipeline tests and the browser tests (desktop and phone, with
# accessibility checks), then publishes docs/ at /rent-gap/ stamped v1.<number of commits>.
# /rent-gap/docs/ redirects there so older links keep working.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q test_pipeline.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the site from docs/
        run: |
          VERSION="v1.$(git rev-list --count HEAD)"
          mkdir -p _site/docs
          cp -r docs/. _site/
          sed -i "s|title=\"Version\">dev<|title=\"Version\">$VERSION<|" _site/index.html
          grep -q ">$VERSION<" _site/index.html
          printf '%s\n' '<!DOCTYPE html><meta charset="utf-8"><title>Rent Burden</title>' \
            '<link rel="canonical" href="https://corey.sciu.to/rent-gap/">' \
            '<meta http-equiv="refresh" content="0; url=../">' \
            '<p>Moved to <a href="../">corey.sciu.to/rent-gap/</a>.</p>' > _site/docs/index.html
          echo "Deploying $VERSION"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
