name: Test and deploy

# Tests, then publishes to GitHub Pages stamped v1.<number of commits>.
# The steps live in csciuto/app-template/.github/workflows/app.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    uses: csciuto/app-template/.github/workflows/app.yml@v1
    with:
      site: docs
      python-test: python -m pytest -q test_pipeline.py
      after-build: mkdir -p docs && printf '%s\n' '<!DOCTYPE html><meta charset="utf-8"><title>Rent Burden</title><link rel="canonical" href="https://corey.sciu.to/rent-gap/"><meta http-equiv="refresh" content="0; url=../"><p>Moved to <a href="../">corey.sciu.to/rent-gap/</a>.</p>' > docs/index.html
